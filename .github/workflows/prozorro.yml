name: prozorro-bot

on:
  schedule:
    - cron: "7,37 * * * *"        # кожні 30 хв (GitHub може запускати із запізненням 5-20 хв)
  workflow_dispatch:
    inputs:
      since:
        description: "Дозавантажити з дати (РРРР-ММ-ДД) під час першого запуску; надалі залишайте порожнім"
        required: false
      limit:
        description: "Максимум тендерів за цей запуск"
        required: false
        default: "8000"

permissions:
  contents: write                 # щоб комітити state/ledger.json

concurrency:
  group: prozorro-bot             # ніколи не запускати два проходи одночасно (одна база SQLite)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ADMIN_IDS: ${{ secrets.TG_ADMIN_IDS }}
      TG_REVIEW_CHAT_ID: ${{ secrets.TG_REVIEW_CHAT_ID }}
      TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install requests==2.32.3

      # База тендерів зберігається в кеші Actions (швидко, до 10 ГБ на репозиторій).
      # Кожен запуск зберігає новий запис кешу; наступного разу відновлюється найновіший.
      - name: Відновити базу даних
        uses: actions/cache/restore@v5
        with:
          path: state/prozorro.db
          key: prozorro-db-${{ github.run_id }}
          restore-keys: prozorro-db-

      # Якщо кеш буде витіснено, журнал (у git) відновить рішення та позначку завантаження.
      - name: Відновити журнал у базу даних
        run: python prozorro_publisher.py --db state/prozorro.db ledger-import --path state/ledger.json

      - name: Завантажити тендери й позначити аномалії
        run: |
          ARGS="--window 30 --limit ${{ github.event.inputs.limit || '8000' }}"
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since ${{ github.event.inputs.since }}"; fi
          python prozorro_monitor.py --db state/prozorro.db run $ARGS

      # Історія постачальників (окрема база, її наповнює workflow prozorro-history); тут лише читаємо
      - name: Відновити базу історії
        uses: actions/cache/restore@v5
        with:
          path: state/history.db
          key: prozorro-hist-${{ github.run_id }}
          restore-keys: prozorro-hist-

      # Прапорці «новачок без історії» / «новачок у категорії» (вмикаються після дозавантаження)
      - name: Історія постачальників - прапорці
        continue-on-error: true
        run: python prozorro_history.py --db state/prozorro.db --hist state/history.db flags

      - name: Перевірка в Telegram і публікація схваленого
        run: python prozorro_publisher.py --db state/prozorro.db ci --path state/ledger.json

      # Тіньова модель: вчиться на рішеннях ✅/❌, бот її поки не використовує. Її помилка не зупиняє бота.
      - name: Тіньова модель
        continue-on-error: true
        run: python prozorro_model.py --db state/prozorro.db --state state

      - name: Тримати базу малою
        run: python prozorro_monitor.py --db state/prozorro.db prune --days 45 --keep-flagged-days 30

      - name: Зберегти базу даних
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state/prozorro.db
          key: prozorro-db-${{ github.run_id }}

      - name: Закомітити журнал
        run: |
          git config user.name "prozorro-bot"
          git config user.email "prozorro-bot@users.noreply.github.com"
          git add state/ledger.json $(ls state/decisions.jsonl state/shadow.jsonl state/model.json 2>/dev/null)
          git diff --cached --quiet || (git commit -m "оновлення журналу" && (git push || (git pull --rebase origin main && git push)))

      - name: Сповістити про помилку
        if: failure() || cancelled()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REVIEW_CHAT_ID}" \
            --data-urlencode "text=⚠️ Прохід prozorro-bot не вдався: ${RUN_URL}" > /dev/null || true
