name: prozorro-bot

# Аналітичний прохід: тендери -> прапорці -> чернетки у Worker (Cloudflare).
# Натискання в Telegram, черга перевірки й публікація в канал - у Worker, тут їх немає.
on:
  schedule:
    - cron: "50 */3 * * *"        # лише запасний запуск: основний розклад - cron-job.org (:05 і :35)
  workflow_dispatch:
    inputs:
      since:
        description: "Дозавантажити з дати (РРРР-ММ-ДД) під час першого запуску; надалі залишайте порожнім"
        required: false
      limit:
        description: "Максимум тендерів за цей запуск"
        required: false
        default: "8000"

permissions:
  contents: write                 # щоб оновлювати гілку bot-state

concurrency:
  group: prozorro-bot             # ніколи не запускати два проходи одночасно (одна база SQLite)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}          # з нього виводиться ключ API Worker
      TG_REVIEW_CHAT_ID: ${{ secrets.TG_REVIEW_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6

      # Резервна копія і файли моделі живуть в окремій гілці bot-state (один коміт, що перезаписується),
      # щоб не засмічувати історію main
      - name: Стан бота з гілки bot-state
        run: |
          if git fetch -q --depth=1 origin +refs/heads/bot-state:refs/remotes/origin/bot-state; then
            git checkout origin/bot-state -- state/ && git reset -q
          else
            echo "гілки bot-state ще немає - почнемо з порожнього стану"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install requests==2.32.3

      # База тендерів - лише аналітика, у кеші Actions. Якщо кеш зникне, тендери завантажаться знову;
      # чернетки й рішення зберігаються у Worker, тож нічого не задвоїться.
      - name: Відновити базу даних
        uses: actions/cache/restore@v5
        with:
          path: state/prozorro.db
          key: prozorro-db-${{ github.run_id }}
          restore-keys: prozorro-db-

      - name: Завантажити тендери й позначити аномалії
        run: |
          ARGS="--window 30 --limit ${{ github.event.inputs.limit || '8000' }}"
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since ${{ github.event.inputs.since }}"; fi
          python prozorro_monitor.py --db state/prozorro.db run $ARGS

      # Історія постачальників (окрема база, її наповнює workflow prozorro-history); тут лише читаємо
      - name: Відновити базу історії
        uses: actions/cache/restore@v5
        with:
          path: state/history.db
          key: prozorro-hist-${{ github.run_id }}
          restore-keys: prozorro-hist-

      - name: Історія постачальників - прапорці
        continue-on-error: true
        run: python prozorro_history.py --db state/prozorro.db --hist state/history.db flags

      - name: Рішення з Worker
        run: python -m prozorro.pipeline sync

      # Тіньова модель: вчиться на рішеннях ✅/❌. Її помилка не зупиняє бота.
      - name: Тіньова модель
        continue-on-error: true
        run: |
          python prozorro_model.py --db state/prozorro.db --state state
          python -m prozorro.pipeline meta

      - name: Нові чернетки у Worker
        run: python -m prozorro.pipeline draft

      - name: Тримати базу малою
        run: python prozorro_monitor.py --db state/prozorro.db prune --days 45 --keep-flagged-days 30

      - name: Зберегти базу даних
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state/prozorro.db
          key: prozorro-db-${{ github.run_id }}

      - name: Зберегти стан у гілку bot-state
        env:
          GIT_AUTHOR_NAME: prozorro-bot
          GIT_AUTHOR_EMAIL: prozorro-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: prozorro-bot
          GIT_COMMITTER_EMAIL: prozorro-bot@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/bot-state-index"
          git read-tree --empty
          git add -f $(ls state/backup.json state/decisions.jsonl state/shadow.jsonl state/model.json 2>/dev/null)
          TREE=$(git write-tree)
          if [ "$(git rev-parse -q --verify 'origin/bot-state^{tree}' || true)" = "$TREE" ]; then echo "без змін"; exit 0; fi
          C=$(git commit-tree "$TREE" -m "стан бота: $(date -u '+%Y-%m-%d %H:%M') UTC")
          git push -q -f origin "$C:refs/heads/bot-state"

      - name: Сповістити про помилку
        if: failure() || cancelled()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_REVIEW_CHAT_ID}" \
            --data-urlencode "text=⚠️ Прохід prozorro-bot не вдався: ${RUN_URL}" > /dev/null || true
